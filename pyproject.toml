readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "torch>=2.2.0,<3.0.0",
    "hydra-core>=1.3.2,<2.0.0",
    "omegaconf>=2.3.0,<3.0.0",
    "tqdm==4.67.1",
    "numpy",
    "matplotlib",
    "cvxpy==1.7.3",
